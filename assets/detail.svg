<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title id="title">让 DSH 背景随声音起伏</title>
  <desc id="desc">流式朗读、音乐面板和设备声音可驱动聊天文字后方的居中频谱。支持自定义渐变、空闲沉浸和淡入淡出。</desc>
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#D7E9FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#D7E9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum" x2="100%" y2="0%">
      <stop stop-color="#7C91F3" stop-opacity=".32"/>
      <stop offset=".52" stop-color="#85BFF4" stop-opacity=".84"/>
      <stop offset="1" stop-color="#8DDFDA" stop-opacity=".44"/>
    </linearGradient>
  </defs>

  <rect width="640" height="300" fill="#F5F6FC"/>
  <circle cx="628" cy="6" r="170" fill="url(#glow)"/>
  <text x="32" y="62" fill="#16213D" font-size="30" font-weight="700" letter-spacing=".5">让 DSH 背景随声音起伏</text>
  <text x="32" y="90" fill="#596985" font-size="13">流式朗读 · 音乐面板 · 设备声音，频谱在聊天文字后方居中呈现</text>

  <g fill="#1F2A44" opacity=".06">
    <rect x="32" y="111" width="400" height="164" rx="14"/>
    <rect x="448" y="111" width="160" height="164" rx="14"/>
  </g>
  <g fill="#FFF" stroke="#E1E6F3">
    <rect x="32" y="108" width="400" height="164" rx="14"/>
    <rect x="448" y="108" width="160" height="164" rx="14"/>
  </g>

  <text x="48" y="136" fill="#1F2A44" font-size="14" font-weight="700">对话背景</text>
  <rect x="332" y="120" width="84" height="22" rx="6" fill="#EAF4FF"/>
  <circle cx="344" cy="131" r="3" fill="#417AB5"/>
  <text x="352" y="135" fill="#285B91" font-size="11">音乐面板</text>

  <rect x="48" y="151" width="368" height="83" rx="9" fill="#14253E"/>
  <path d="M65 192.5H399" stroke="#9AC1EC" stroke-opacity=".2"/>
  <path d="M72 190v5 M82 188v9 M92 186v13 M102 182v21 M112 177v31 M122 183v19 M132 187v11 M142 180v25 M152 174v37 M162 178v29 M172 169v47 M182 176v33 M192 181v23 M202 174v37 M212 167v51 M222 173v39 M232 162v61 M242 170v45 M252 176v33 M262 168v49 M272 175v35 M282 181v23 M292 173v39 M302 179v27 M312 184v17 M322 178v29 M332 183v19 M342 187v11 M352 181v23 M362 185v15 M372 188v9 M382 187v11 M392 190v5"
    fill="none" stroke="url(#spectrum)" stroke-linecap="round" stroke-width="3"/>
  <rect x="144" y="178" width="176" height="29" rx="6" fill="#14253E" fill-opacity=".86"/>
  <text x="232" y="197" text-anchor="middle" fill="#F0F6FF" font-size="13">让这首歌继续播放吧</text>

  <rect x="48" y="242" width="18" height="18" rx="5" fill="#EAF2FF"/>
  <path d="M52.5 250v2 M57 247v8 M61.5 249v4" fill="none" stroke="#3E70BA" stroke-width="1.6" stroke-linecap="round"/>
  <text x="75" y="254" fill="#365F9B" font-size="11">实时频谱</text>
  <text x="416" y="254" text-anchor="end" fill="#596985" font-size="11">空闲后可进入沉浸模式</text>

  <text x="464" y="136" fill="#1F2A44" font-size="14" font-weight="700">显示设置</text>
  <g fill="#EAF2FF">
    <rect x="464" y="157" width="16" height="16" rx="5"/>
    <rect x="464" y="185" width="16" height="16" rx="5"/>
    <rect x="464" y="213" width="16" height="16" rx="5"/>
    <rect x="464" y="241" width="16" height="16" rx="5"/>
  </g>
